spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:taskflow
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars-long}
    expiration-ms: 86400000